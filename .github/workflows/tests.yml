name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg  # no display on the runner; the smoke tests also force Agg
    steps:
      # Actions are pinned to a full commit SHA (the tag in the comment): a tag can be moved.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # uv then installs the Python from .python-version (3.12).
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      # --locked: fail if uv.lock is out of date with pyproject.toml, instead of updating it.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest -q
